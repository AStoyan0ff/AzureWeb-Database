name: Terraform Plan and Apply

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the Terraform plan to Azure
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: taskboard-terraform

defaults:
  run:
    working-directory: 4.TaskBoard-Terraform-CICD

env:
  TF_IN_AUTOMATION: "true"
  ARM_RESOURCE_PROVIDER_REGISTRATIONS: none
  TF_VAR_sql_admin_password: ${{ secrets.SQL_ADMIN_PASSWORD }}

jobs:
  plan:
    runs-on: ubuntu-latest

    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@v4

      - &setup
        name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.1"

      - &azure_login
        name: Sign in to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - &terraform_credentials
        name: Configure Terraform credentials
        shell: bash
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          set -euo pipefail
          client_id=$(jq -er '.clientId' <<< "$AZURE_CREDENTIALS")
          client_secret=$(jq -er '.clientSecret' <<< "$AZURE_CREDENTIALS")
          tenant_id=$(jq -er '.tenantId' <<< "$AZURE_CREDENTIALS")
          subscription_id=$(jq -er '.subscriptionId' <<< "$AZURE_CREDENTIALS")

          printf '::add-mask::%s\n' "$client_secret"
          printf 'ARM_CLIENT_ID=%s\nARM_CLIENT_SECRET=%s\nARM_TENANT_ID=%s\nARM_SUBSCRIPTION_ID=%s\n' \
            "$client_id" "$client_secret" "$tenant_id" "$subscription_id" >> "$GITHUB_ENV"

      - &terraform_init
        name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan
        run: terraform plan -input=false -lock-timeout=2m

  apply:
    needs: plan
    if: ${{ inputs.apply }}
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *setup
      - *azure_login
      - *terraform_credentials
      - *terraform_init

      - name: Save Terraform plan
        run: terraform plan -input=false -lock-timeout=2m -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -lock-timeout=2m tfplan